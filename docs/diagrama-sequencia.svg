<svg width="680" height="620" viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Diagrama de sequência do FinGuard</title>
<desc>Reclamação chega ao Guardrail Bedrock. Se bloqueado, retorna resposta educada e termina. Se aprovado, segue para o Agente de Triagem, depois Agente de Risco (que consulta o RAG/FAISS na política interna e cita a cláusula), e por fim o resultado alimenta o Agente de Relatório, que agrega o lote inteiro.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#1c1c1e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>
  text { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #1c1c1e; }
  .t { font-size: 14px; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; fill: #6b6b70; }
  .leader { stroke: #b8b8bd; stroke-width: 1; stroke-dasharray: 3 3; }
  .arr { stroke: #1c1c1e; stroke-width: 1.5; fill: none; }
  .box { fill: #fafafa; stroke: #d4d4d8; stroke-width: 1; }
  .red-box { fill: #fceded; stroke: #b23a2f; }
  .red-text { fill: #7a2820; }
  .blue-box { fill: #eaf1fb; stroke: #2f5fa3; }
  .blue-text { fill: #1f3f70; }
</style>

<rect width="680" height="620" fill="white"/>

<line x1="105" y1="90" x2="105" y2="580" class="leader"/>
<line x1="255" y1="90" x2="255" y2="580" class="leader"/>
<line x1="405" y1="90" x2="405" y2="580" class="leader"/>
<line x1="555" y1="90" x2="555" y2="580" class="leader"/>

<line x1="44" y1="140" x2="99" y2="140" class="arr" marker-end="url(#arrow)"/>
<text x="44" y="132" class="ts" text-anchor="start">reclamação</text>

<line x1="105" y1="210" x2="249" y2="210" class="arr" marker-end="url(#arrow)"/>
<text x="115" y="203" class="ts" text-anchor="start">[aprovado]</text>
<line x1="105" y1="210" x2="112" y2="248" class="arr" marker-end="url(#arrow)" style="stroke-dasharray:4 3"/>
<text x="118" y="230" class="ts" text-anchor="start">[bloqueado]</text>

<line x1="255" y1="350" x2="399" y2="350" class="arr" marker-end="url(#arrow)"/>
<text x="270" y="343" class="ts" text-anchor="start">classificação</text>

<line x1="405" y1="490" x2="549" y2="490" class="arr" marker-end="url(#arrow)"/>
<text x="420" y="483" class="ts" text-anchor="start">risco + cláusula</text>

<line x1="555" y1="490" x2="555" y2="528" class="arr" marker-end="url(#arrow)"/>

<rect x="40" y="40" width="130" height="50" rx="4" class="red-box"/>
<text x="105" y="61" class="th red-text" text-anchor="middle">Guardrail</text>
<text x="105" y="77" class="ts" text-anchor="middle">Bedrock</text>

<rect x="190" y="40" width="130" height="50" rx="4" class="blue-box"/>
<text x="255" y="61" class="th blue-text" text-anchor="middle">Triagem</text>
<text x="255" y="77" class="ts" text-anchor="middle">Nova Micro</text>

<rect x="340" y="40" width="130" height="50" rx="4" class="blue-box"/>
<text x="405" y="61" class="th blue-text" text-anchor="middle">Risco</text>
<text x="405" y="77" class="ts" text-anchor="middle">DeepSeek + RAG</text>

<rect x="490" y="40" width="130" height="50" rx="4" class="blue-box"/>
<text x="555" y="61" class="th blue-text" text-anchor="middle">Relatório</text>
<text x="555" y="77" class="ts" text-anchor="middle">agrega o lote</text>

<rect x="40" y="250" width="145" height="54" rx="4" class="box"/>
<text x="112" y="270" class="t" text-anchor="middle">Resposta educada</text>
<text x="112" y="288" class="ts" text-anchor="middle">fim</text>

<rect x="335" y="400" width="140" height="44" rx="4" class="box"/>
<text x="405" y="418" class="t" text-anchor="middle">RAG (FAISS)</text>
<text x="405" y="434" class="ts" text-anchor="middle">busca 3 seções</text>

<rect x="480" y="530" width="150" height="50" rx="4" class="box"/>
<text x="555" y="550" class="t" text-anchor="middle">Agrega lote</text>
<text x="555" y="566" class="ts" text-anchor="middle">dashboard, críticas</text>
</svg>
