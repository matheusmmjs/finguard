<svg width="680" height="550" viewBox="0 0 680 550" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Como o FinGuard processa uma reclamação, em linguagem simples</title>
<desc>A reclamação do cliente chega e o sistema primeiro verifica se é uma reclamação real ou uma tentativa de ataque. Se for ataque, bloqueia e responde educadamente. Se for real, classifica o problema e a urgência, avalia o risco seguindo as regras internas do banco, e gera um relatório para a equipe de gestão com as reclamações críticas em destaque.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#1c1c1e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>
  text { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #1c1c1e; }
  .t { font-size: 14px; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; fill: #6b6b70; }
  .arr { stroke: #1c1c1e; stroke-width: 1.5; fill: none; }
  .box { fill: #fafafa; stroke: #d4d4d8; stroke-width: 1; }
  .red-box { fill: #fceded; stroke: #b23a2f; }
  .blue-box { fill: #eaf1fb; stroke: #2f5fa3; }
</style>

<rect width="680" height="550" fill="white"/>

<line x1="300" y1="94" x2="300" y2="112" class="arr" marker-end="url(#arrow)"/>
<line x1="300" y1="198" x2="300" y2="236" class="arr" marker-end="url(#arrow)"/>
<line x1="460" y1="160" x2="553" y2="234" class="arr" marker-end="url(#arrow)"/>
<line x1="300" y1="292" x2="300" y2="330" class="arr" marker-end="url(#arrow)"/>
<line x1="300" y1="416" x2="300" y2="454" class="arr" marker-end="url(#arrow)"/>

<text x="150" y="222" class="ts" text-anchor="start">reclamação normal</text>
<text x="466" y="212" class="ts" text-anchor="start">detectou ataque</text>

<rect x="140" y="40" width="320" height="54" rx="4" class="box"/>
<text x="300" y="72" class="t" text-anchor="middle">A reclamação do cliente chega</text>

<rect x="140" y="114" width="320" height="84" rx="4" class="red-box"/>
<text x="300" y="144" class="t" text-anchor="middle">Verifica se é reclamação real</text>
<text x="300" y="163" class="t" text-anchor="middle">ou uma tentativa de ataque</text>
<text x="300" y="184" class="ts" text-anchor="middle">guardrail Bedrock</text>

<rect x="490" y="238" width="140" height="54" rx="4" class="red-box"/>
<text x="560" y="260" class="th" text-anchor="middle">Bloqueado</text>
<text x="560" y="277" class="ts" text-anchor="middle">resposta educada</text>

<rect x="140" y="238" width="320" height="54" rx="4" class="blue-box"/>
<text x="300" y="262" class="t" text-anchor="middle">Classifica o problema e a urgência</text>
<text x="300" y="280" class="ts" text-anchor="middle">Nova Micro</text>

<rect x="140" y="332" width="320" height="84" rx="4" class="blue-box"/>
<text x="300" y="362" class="t" text-anchor="middle">Avalia o risco seguindo as regras</text>
<text x="300" y="381" class="t" text-anchor="middle">internas do banco</text>
<text x="300" y="402" class="ts" text-anchor="middle">DeepSeek + política interna</text>

<rect x="140" y="456" width="320" height="54" rx="4" class="box"/>
<text x="300" y="480" class="t" text-anchor="middle">Gera relatório pra equipe de gestão</text>
<text x="300" y="498" class="ts" text-anchor="middle">críticas em destaque</text>
</svg>
