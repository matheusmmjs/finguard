[project]
name = "finguard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "boto3>=1.34",
    "langgraph>=0.2",
    "faiss-cpu>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Bloco de CSS embutido -- quebrar linha prejudica legibilidade do CSS em si.
"src/finguard/report_html.py" = ["E501"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=finguard --cov-report=term-missing --cov-fail-under=90"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
